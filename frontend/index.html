<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1c2430; background: #f4f6f9; }
      body { margin: 0; }
      main { max-width: 760px; margin: 0 auto; padding: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; }
      h1 { font-size: 1.5rem; margin: 8px 0; }
      h2 { font-size: 1.1rem; margin: 24px 0 8px; }
      section { background: #fff; border-radius: 10px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      form { display: flex; gap: 8px; flex-wrap: wrap; }
      input { padding: 8px; border: 1px solid #c4ccd8; border-radius: 6px; font: inherit; }
      input[name=title] { flex: 1 1 200px; }
      input[name=estimate] { width: 110px; }
      button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2457d6; color: #fff; font: inherit; cursor: pointer; }
      button.secondary { background: #e3e8f1; color: #1c2430; }
      button:disabled { opacity: .5; cursor: default; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid #e6eaf0; }
      li:first-child { border-top: 0; }
      .meta { color: #5b6677; font-size: .85rem; }
      .actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .error { background: #fde8e8; color: #8a1c1c; padding: 8px 12px; border-radius: 6px; margin: 12px 0; }
      .note { background: #e8f0fe; color: #1a3d8f; padding: 8px 12px; border-radius: 6px; margin: 12px 0; }
      .center { text-align: center; padding: 48px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
